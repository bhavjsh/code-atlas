<svg width="660" height="460" viewBox="0 0 660 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <rect width="660" height="460" fill="#0d1117"/>

  <!-- 1. MCP Client -->
  <rect x="180" y="20" width="300" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="330" y="46" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">MCP Client</text>
  <text x="330" y="66" text-anchor="middle" fill="#8b949e" font-size="11">Cursor, VS Code, or any MCP agent</text>

  <!-- Arrow down -->
  <line x1="330" y1="80" x2="330" y2="108" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="345" y="98" fill="#6e7681" font-size="10">stdio</text>

  <!-- 2. Code Atlas Server -->
  <rect x="130" y="110" width="400" height="72" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="330" y="138" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Code Atlas Server</text>
  <text x="330" y="158" text-anchor="middle" fill="#8b949e" font-size="11">@modelcontextprotocol/sdk</text>
  <text x="330" y="174" text-anchor="middle" fill="#6e7681" font-size="10">Zod schema validation on all inputs</text>

  <!-- Arrow down -->
  <line x1="330" y1="182" x2="330" y2="210" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3. Tools grid -->
  <rect x="20" y="212" width="620" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="330" y="234" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">8 Tools</text>

  <!-- Row 1 -->
  <rect x="32"  y="242" width="140" height="24" rx="5" fill="#21262d"/>
  <text x="102" y="258" text-anchor="middle" fill="#8b949e" font-size="10">find_entry_points</text>

  <rect x="180" y="242" width="140" height="24" rx="5" fill="#21262d"/>
  <text x="250" y="258" text-anchor="middle" fill="#8b949e" font-size="10">list_dependencies</text>

  <rect x="328" y="242" width="140" height="24" rx="5" fill="#21262d"/>
  <text x="398" y="258" text-anchor="middle" fill="#8b949e" font-size="10">summarize_folder</text>

  <rect x="476" y="242" width="152" height="24" rx="5" fill="#21262d"/>
  <text x="552" y="258" text-anchor="middle" fill="#8b949e" font-size="10">read_file</text>

  <!-- Row 2 -->
  <rect x="32"  y="272" width="140" height="24" rx="5" fill="#21262d"/>
  <text x="102" y="288" text-anchor="middle" fill="#8b949e" font-size="10">get_file_tree</text>

  <rect x="180" y="272" width="140" height="24" rx="5" fill="#21262d"/>
  <text x="250" y="288" text-anchor="middle" fill="#8b949e" font-size="10">detect_stack</text>

  <rect x="328" y="272" width="140" height="24" rx="5" fill="#21262d"/>
  <text x="398" y="288" text-anchor="middle" fill="#8b949e" font-size="10">search_code</text>

  <rect x="476" y="272" width="152" height="24" rx="5" fill="#21262d"/>
  <text x="552" y="288" text-anchor="middle" fill="#8b949e" font-size="10">find_todos</text>

  <!-- Arrow down -->
  <line x1="330" y1="300" x2="330" y2="328" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4. Security / Utils -->
  <rect x="20" y="330" width="300" height="72" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
  <text x="170" y="356" text-anchor="middle" fill="#f85149" font-size="12" font-weight="600">sandbox.ts</text>
  <text x="170" y="374" text-anchor="middle" fill="#8b949e" font-size="10">resolves and validates every path</text>
  <text x="170" y="388" text-anchor="middle" fill="#8b949e" font-size="10">blocks access outside workspace root</text>

  <rect x="340" y="330" width="300" height="72" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="490" y="356" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">gitignore.ts</text>
  <text x="490" y="374" text-anchor="middle" fill="#8b949e" font-size="10">reads .gitignore at runtime</text>
  <text x="490" y="388" text-anchor="middle" fill="#8b949e" font-size="10">filters all file walks automatically</text>

  <!-- Arrow down -->
  <line x1="330" y1="402" x2="330" y2="428" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5. Workspace -->
  <rect x="130" y="430" width="400" height="22" rx="6" fill="#21262d"/>
  <text x="330" y="445" text-anchor="middle" fill="#8b949e" font-size="11">Workspace files (.ts, .py, .js, package.json, ...)</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#30363d"/>
    </marker>
  </defs>

</svg>
