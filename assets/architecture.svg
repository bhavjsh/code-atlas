<svg width="820" height="400" viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="820" height="400" fill="#0d1117"/>

  <!-- ── ROW 1: Main flow ── -->

  <!-- Editor / Agent -->
  <rect x="30" y="40" width="160" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Editor / Agent</text>
  <text x="110" y="88" text-anchor="middle" fill="#8b949e" font-size="11">Cursor, VS Code, etc.</text>

  <!-- Arrow right -->
  <line x1="191" y1="72" x2="258" y2="72" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="224" y="65" text-anchor="middle" fill="#6e7681" font-size="10">stdio</text>

  <!-- Code Atlas Server (highlighted) -->
  <rect x="260" y="28" width="300" height="88" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="410" y="60" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Code Atlas Server</text>
  <text x="410" y="80" text-anchor="middle" fill="#8b949e" font-size="11">@modelcontextprotocol/sdk</text>
  <text x="410" y="98" text-anchor="middle" fill="#6e7681" font-size="10">stdio transport · Zod input validation</text>

  <!-- Arrow right -->
  <line x1="561" y1="72" x2="628" y2="72" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="594" y="65" text-anchor="middle" fill="#6e7681" font-size="10">reads</text>

  <!-- Your Repository -->
  <rect x="630" y="40" width="160" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="710" y="68" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Your Repository</text>
  <text x="710" y="88" text-anchor="middle" fill="#8b949e" font-size="11">any local codebase</text>

  <!-- Arrow down from server to tools -->
  <line x1="410" y1="116" x2="410" y2="148" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── ROW 2: Tools ── -->
  <text x="410" y="144" text-anchor="middle" fill="#6e7681" font-size="10">dispatches to</text>

  <!-- Tool pills row 1 -->
  <rect x="30"  y="158" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="119" y="178" text-anchor="middle" fill="#8b949e" font-size="11">find_entry_points</text>

  <rect x="216" y="158" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="305" y="178" text-anchor="middle" fill="#8b949e" font-size="11">list_dependencies</text>

  <rect x="402" y="158" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="491" y="178" text-anchor="middle" fill="#8b949e" font-size="11">summarize_folder</text>

  <rect x="588" y="158" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="677" y="178" text-anchor="middle" fill="#8b949e" font-size="11">read_file</text>

  <!-- Tool pills row 2 -->
  <rect x="30"  y="196" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="119" y="216" text-anchor="middle" fill="#8b949e" font-size="11">get_file_tree</text>

  <rect x="216" y="196" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="305" y="216" text-anchor="middle" fill="#8b949e" font-size="11">detect_stack</text>

  <rect x="402" y="196" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="491" y="216" text-anchor="middle" fill="#8b949e" font-size="11">search_code</text>

  <rect x="588" y="196" width="178" height="30" rx="6" fill="#21262d"/>
  <text x="677" y="216" text-anchor="middle" fill="#8b949e" font-size="11">find_todos</text>

  <!-- Arrow down to security layer -->
  <line x1="410" y1="226" x2="410" y2="262" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── ROW 3: Security / Utils ── -->

  <!-- sandbox -->
  <rect x="30" y="270" width="230" height="64" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
  <text x="145" y="296" text-anchor="middle" fill="#f85149" font-size="12" font-weight="600">sandbox.ts</text>
  <text x="145" y="314" text-anchor="middle" fill="#8b949e" font-size="10">blocks any path outside</text>
  <text x="145" y="328" text-anchor="middle" fill="#8b949e" font-size="10">the workspace root</text>

  <!-- gitignore -->
  <rect x="278" y="270" width="230" height="64" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="393" y="296" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">gitignore.ts</text>
  <text x="393" y="314" text-anchor="middle" fill="#8b949e" font-size="10">loads .gitignore patterns</text>
  <text x="393" y="328" text-anchor="middle" fill="#8b949e" font-size="10">and filters file walks</text>

  <!-- structured response -->
  <rect x="526" y="270" width="264" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="658" y="296" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Structured Response</text>
  <text x="658" y="314" text-anchor="middle" fill="#8b949e" font-size="10">JSON-RPC result returned</text>
  <text x="658" y="328" text-anchor="middle" fill="#8b949e" font-size="10">to the client over stdio</text>

  <!-- Arrowhead -->
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#30363d"/>
    </marker>
  </defs>

</svg>
